<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Dynamic Pulse Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(0.8deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.04); }
      }
      @keyframes beamMove {
        0% { stroke-dashoffset: 160; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes textShimmer {
        0%, 100% { fill: url(#glowGrad); filter: drop-shadow(0 0 10px rgba(129, 140, 248, 0.4)); }
        50% { fill: url(#glowGrad); filter: drop-shadow(0 0 20px rgba(192, 132, 252, 0.75)); }
      }
      @keyframes nodePulse {
        0%, 100% { r: 5; opacity: 0.8; }
        50% { r: 8; opacity: 1; }
      }
      .floating-card {
        animation: floatSlow 5.5s ease-in-out infinite;
      }
      .pulsing-glow {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: center;
      }
      .anim-beam {
        stroke-dasharray: 10, 10;
        animation: beamMove 2.8s linear infinite;
      }
      .shimmer-title {
        animation: textShimmer 4s ease-in-out infinite;
      }
      .pulse-circle {
        animation: nodePulse 2.2s ease-in-out infinite;
      }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.22">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="180" cy="80" r="140" fill="#38bdf8" filter="url(#glow)" class="pulsing-glow" opacity="0.2" />
  <circle cx="1020" cy="240" r="150" fill="#c084fc" filter="url(#glow)" class="pulsing-glow" opacity="0.22" />
  <circle cx="600" cy="180" r="110" fill="#818cf8" filter="url(#glow)" class="pulsing-glow" opacity="0.12" />

  <!-- Left Side: Title & Description (Bounded width: 0 to 650px) -->
  <g transform="translate(50, 0)">
    <!-- Pill Tag -->
    <g transform="translate(0, 46)">
      <rect width="250" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="14" cy="13" r="4.5" fill="#38bdf8" class="pulse-circle" />
      <text x="27" y="17" fill="#94a3b8" class="badge-text" font-size="11" letter-spacing="0.5">FINTECH &amp; ACCOUNTING ECOSYSTEM</text>
    </g>

    <!-- Main Title (Compact & Elegant: 36px font) -->
    <text x="0" y="118" class="title-text shimmer-title" font-size="36" font-weight="900">Awesome Account</text>
    <text x="0" y="160" class="title-text" font-size="36" fill="#ffffff" font-weight="900">Reconciliation Platforms ⚡</text>

    <!-- Subtitle -->
    <text x="0" y="202" class="sub-text" font-size="14.5" fill="#94a3b8">
      Curated ecosystem of SaaS &amp; Open-Source tools for Transaction Matching,
    </text>
    <text x="0" y="224" class="sub-text" font-size="14.5" fill="#94a3b8">
      Financial Close, Balance-Sheet Substantiation &amp; Ledger Automation.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 262)">
      <g transform="translate(0, 0)">
        <rect width="130" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
        <text x="65" y="19" fill="#38bdf8" class="badge-text" font-size="11" text-anchor="middle">🔍 Auto-Matching</text>
      </g>
      <g transform="translate(140, 0)">
        <rect width="150" height="30" rx="15" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
        <text x="75" y="19" fill="#818cf8" class="badge-text" font-size="11" text-anchor="middle">⚖️ Balance Sheet Close</text>
      </g>
      <g transform="translate(300, 0)">
        <rect width="145" height="30" rx="15" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" opacity="0.9" />
        <text x="72.5" y="19" fill="#c084fc" class="badge-text" font-size="11" text-anchor="middle">🚀 Open Infrastructure</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Graphic Visual (Completely separated, starting at x=740) -->
  <g transform="translate(740, 52)" class="floating-card">
    <!-- Connecting animated beams -->
    <path d="M 125 78 L 175 125" stroke="#38bdf8" stroke-width="2.5" class="anim-beam" fill="none" opacity="0.85" />
    <path d="M 125 182 L 175 135" stroke="#818cf8" stroke-width="2.5" class="anim-beam" fill="none" opacity="0.85" />
    <path d="M 230 130 L 268 130" stroke="#34d399" stroke-width="3" class="anim-beam" fill="none" opacity="0.95" />

    <!-- Source A: Bank Records -->
    <g transform="translate(0, 48)">
      <rect width="130" height="60" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" opacity="0.95" />
      <circle cx="20" cy="20" r="7.5" fill="#38bdf8" opacity="0.2" />
      <text x="20" y="24" font-size="11" text-anchor="middle" fill="#38bdf8">🏦</text>
      <text x="34" y="23" fill="#f8fafc" class="badge-text" font-size="11.5">Bank Statement</text>
      <text x="14" y="44" fill="#64748b" class="badge-text" font-size="9.5">$4,520.00 • Txn #981</text>
    </g>

    <!-- Source B: General Ledger -->
    <g transform="translate(0, 152)">
      <rect width="130" height="60" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5" filter="url(#glow)" opacity="0.95" />
      <circle cx="20" cy="20" r="7.5" fill="#818cf8" opacity="0.2" />
      <text x="20" y="24" font-size="11" text-anchor="middle" fill="#818cf8">📑</text>
      <text x="34" y="23" fill="#f8fafc" class="badge-text" font-size="11.5">General Ledger</text>
      <text x="14" y="44" fill="#64748b" class="badge-text" font-size="9.5">$4,520.00 • ERP Entry</text>
    </g>

    <!-- Matching Engine Hub -->
    <g transform="translate(160, 95)">
      <rect width="70" height="70" rx="35" fill="#0f172a" stroke="#c084fc" stroke-width="2.5" filter="url(#glow)" />
      <text x="35" y="42" font-size="22" text-anchor="middle" fill="#ffffff">⚡</text>
      <circle cx="35" cy="35" r="27" stroke="#c084fc" stroke-width="1" stroke-dasharray="4, 4" fill="none" />
    </g>

    <!-- Reconciled Output -->
    <g transform="translate(265, 100)">
      <rect width="140" height="60" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.8" filter="url(#glow)" opacity="0.98" />
      <circle cx="20" cy="20" r="8" fill="#10b981" opacity="0.3" />
      <text x="20" y="24" font-size="11" text-anchor="middle" fill="#34d399">✓</text>
      <text x="36" y="23" fill="#34d399" class="badge-text" font-size="11.5">100% Reconciled</text>
      <text x="14" y="44" fill="#94a3b8" class="badge-text" font-size="9.5">Auto-Certified &amp; Closed</text>
    </g>
  </g>
</svg>